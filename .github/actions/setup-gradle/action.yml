name: 'Setup Gradle'
description: 'Set up JDK, and configure Gradle'

inputs:
  java-version:
    description: 'JDK version override (defaults to versions.jdk in gradle/libs.versions.toml)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Read JDK version from version catalog
      if: ${{ inputs.java-version == '' }}
      id: jdk-version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/read-jdk-version.py" >> "$GITHUB_OUTPUT"
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version || steps.jdk-version.outputs.version }}
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
