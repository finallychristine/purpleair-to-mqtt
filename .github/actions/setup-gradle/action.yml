name: 'Setup Gradle'
description: 'Set up JDK, and configure Gradle'

inputs:
  java-version:
    description: 'JDK version to install'
    required: false
    default: '25'
  java-distribution:
    description: 'JDK distribution'
    required: false
    default: 'temurin'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
