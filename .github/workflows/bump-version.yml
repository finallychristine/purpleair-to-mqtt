name: Bump Version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation token
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$RELEASE_AUTOMATION_TOKEN" ]; then
            echo "Set RELEASE_AUTOMATION_TOKEN so the merge can trigger the tag workflow."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Bump patch version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          next_version="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$next_version" > VERSION
          echo "next-version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          branch: automation/bump-version
          delete-branch: true
          commit-message: Bump version to ${{ steps.version.outputs.next-version }}
          title: Bump version to ${{ steps.version.outputs.next-version }}
          body: |
            Monthly version bump to `${{ steps.version.outputs.next-version }}`.

            When this PR merges to `main`, the `Tag Version` workflow will create the `v${{ steps.version.outputs.next-version }}` tag.

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
